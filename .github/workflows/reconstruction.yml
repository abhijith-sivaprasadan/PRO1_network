name: Independent pandapower numerical screening

on:
  push:
    paths:
      - "reconstruction/**"
      - ".github/workflows/reconstruction.yml"
  pull_request:
    paths:
      - "reconstruction/**"
      - ".github/workflows/reconstruction.yml"
  workflow_dispatch:

jobs:
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: python -m pip install -r reconstruction/requirements.txt
      - name: Run numerical tests
        run: python -m pytest -q reconstruction/tests
      - name: Reproduce independent example
        run: python -m reconstruction.run_screen --output independent-run
      - name: Preserve illustrative outputs
        uses: actions/upload-artifact@v4
        with:
          name: independent-pandapower-screen
          path: independent-run/
